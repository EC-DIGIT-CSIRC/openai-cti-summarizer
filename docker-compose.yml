  # The main microservice, serving the OpenAI summarizer
  #
  openai-summarizer:
    image: openai-summarizer:${VERSION}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VERSION=${VERSION}
    environment:
      PYTHONPATH: /app
    env_file: .env
    ports:
      - "9001:9999"
    dns: 8.8.8.8
    # network_mode: host
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./static:/app/static
      - ./VERSION.txt:/app/VERSION.txt:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openai-summarizer.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.openai-summarizer.entrypoints=websecure"
      - "traefik.http.routers.openai-summarizer.tls.certresolver=myresolver"
      - "traefik.http.services.openai-summarizer.loadbalancer.server.port=9999"
    networks:
      - web

networks:
  web:
    external: true
