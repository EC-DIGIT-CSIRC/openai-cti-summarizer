[project]
name = "openai-cti-summarizer"
version = "0.6.0"
description = "FastAPI CTI report summarizer with structured Pydantic output."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4",
    "click",
    "fastapi",
    "jinja2",
    "langsmith>=0.8.3",
    "markdown",
    "markupsafe",
    "pydantic",
    "pydantic-ai-slim[anthropic,openai,openrouter]",
    "pydantic-settings",
    "pymupdf",
    "python-dotenv",
    "python-multipart",
    "redis==7.4.0",
    "requests",
    "starlette",
    "uvicorn",
]

[project.scripts]
cti-summarizer = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pylint",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
